<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="../">
    <title>Grafo metropolitano del agua</title>
    <meta name="description" content="Grafo de conocimiento del agua en la Zona Metropolitana de Ciudad de México: municipios, colonias, acuíferos, pozos y presas, consultado con SPARQL en el navegador.">
    <link rel="stylesheet" href="assets/vendor/leaflet-1.9.4.css">
    <link rel="stylesheet" href="assets/estilo.css?v=20261105-ui2">
    <link rel="stylesheet" href="assets/paginas.css">
    <link rel="stylesheet" href="ijcopi/zm.css?v=20261105-ui2">
    <script src="assets/i18n.js"></script>
</head>
<body>
<a class="zm-salto" href="ijcopi/grafo-zm.html#contenido">Saltar al contenido / Skip to content</a>
<header data-barra></header>
<main id="contenido" class="app-container" tabindex="-1">
    <noscript><p class="status show error">Activa JavaScript para explorar el grafo. / Enable JavaScript to explore the graph.</p></noscript>
    <div class="zm-cabecera">
        <div>
            <h1 data-t="titulo"></h1>
            <p data-t="lema"></p>
        </div>
        <nav class="zm-nav" aria-label="Versión extendida">
            <a href="ijcopi/mapa-zm.html" data-t="nav.mapa"></a>
            <a href="ijcopi/grafo-zm.html" aria-current="page" data-t="nav.grafo"></a>
            <a href="ijcopi/consultas.html" data-t="nav.consultas"></a>
            <a href="ijcopi/atipicos.html" data-t="nav.atipicos"></a>
        </nav>
    </div>

    <div id="status" class="status" role="status" aria-live="polite" aria-atomic="true"></div>

    <div class="zm-kpis">
        <div class="panel zm-kpi"><span data-t="k.tripletas"></span><b id="kTripletas">—</b></div>
        <div class="panel zm-kpi"><span data-t="k.municipios"></span><b id="kMunicipios">—</b></div>
        <div class="panel zm-kpi"><span data-t="k.fronteras"></span><b id="kFronteras">—</b></div>
        <div class="panel zm-kpi"><span data-t="k.colonias"></span><b id="kColonias">—</b></div>
        <div class="panel zm-kpi"><span data-t="k.vecinas"></span><b id="kVecinas">—</b></div>
    </div>

    <div class="zm-g2">
        <div class="map-wrap"><div id="map" role="region" aria-label="Mapa del grafo / Graph map"></div></div>
        <aside class="panel zm-lateral">
            <h2 class="zm-sub" data-t="r.titulo"></h2>
            <p class="zm-nota" data-t="r.ayuda"></p>
            <label for="municipio" data-t="r.municipio"></label>
            <select id="municipio" class="zm-selector" disabled></select>
            <div id="leyendaGrafo"></div>
            <div id="recorrido"></div>
        </aside>
    </div>

    <section class="panel zm-card zm-sparql">
        <h2 data-t="s.titulo"></h2>
        <p class="zm-nota" data-t="s.ayuda"></p>
        <div class="zm-s2">
            <div id="ejemplos" class="zm-ejemplos"></div>
            <div>
                <label for="consulta" data-t="s.etiqueta"></label>
                <textarea id="consulta" spellcheck="false"></textarea>
                <div class="zm-acciones">
                    <button class="btn btn-primary" id="ejecutar" type="button" disabled data-t="s.ejecutar"></button>
                    <span id="metrica" class="zm-meta" role="status" aria-live="polite"></span>
                </div>
            </div>
        </div>
        <div id="salida" class="zm-tabla"></div>
    </section>

    <section class="panel zm-origen">
        <h2 data-t="o.titulo"></h2>
        <p data-t="o.texto"></p>
        <p id="origenHash" class="zm-meta"></p>
    </section>
</main>
<footer data-pie></footer>
<script src="assets/vendor/leaflet-1.9.4.js"></script>
<script src="assets/mapa-teselas.js"></script>
<script src="assets/nav.js?v=20261109"></script>

<script src="ijcopi/grafo-zm.js?v=20261109"></script>

</html>
