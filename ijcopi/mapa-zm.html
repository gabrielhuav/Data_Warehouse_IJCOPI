<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- La pagina comparte assets/ con la demostracion de ICOKG; base evita tocar esos archivos. -->
    <base href="../">
    <title>Agua en la ZM de Ciudad de México</title>
    <meta name="description" content="Mapa del almacén de datos ampliado de agua: 63 municipios, 5,830 colonias, acuíferos, pozos, presas, sequía y calidad del agua en la Zona Metropolitana de Ciudad de México.">
    <link rel="stylesheet" href="assets/vendor/leaflet-1.9.4.css">
    <link rel="stylesheet" href="assets/estilo.css?v=20261105-ui2">
    <link rel="stylesheet" href="assets/paginas.css">
    <link rel="stylesheet" href="ijcopi/zm.css?v=20261105-ui2">
    <script src="assets/i18n.js"></script>
</head>
<body class="zm-explorador">
<a class="zm-salto" href="ijcopi/mapa-zm.html#contenido">Saltar al contenido / Skip to content</a>
<header data-barra></header>
<main id="contenido" class="app-container" tabindex="-1">
    <noscript><p class="status show error">Activa JavaScript para explorar el mapa. / Enable JavaScript to explore the map.</p></noscript>
    <div class="zm-cabecera">
        <div>
            <span class="zm-eyebrow" data-t="ui.explorador"></span>
            <h1 data-t="titulo"></h1>
            <p data-t="lema"></p>
        </div>
        <nav class="zm-nav" aria-label="Versión extendida">
            <a href="ijcopi/mapa-zm.html" aria-current="page" data-t="nav.mapa"></a>
            <a href="ijcopi/grafo-zm.html" data-t="nav.grafo"></a>
            <a href="ijcopi/consultas.html" data-t="nav.consultas"></a>
            <a href="ijcopi/atipicos.html" data-t="nav.atipicos"></a>
        </nav>
    </div>

    <div id="status" class="status" role="status" aria-live="polite" aria-atomic="true"></div>

    <div class="zm-rejilla">
        <aside class="panel zm-control">
          <div class="zm-indicador-campo">
            <label for="indicador" data-t="c.indicador"></label>
            <select id="indicador"></select>
          </div>
          <div class="zm-municipio-campo">
            <label for="buscarMunicipio" data-t="ui.buscar"></label>
            <select id="buscarMunicipio" disabled></select>
          </div>
          <div class="zm-vista-acciones">
            <button class="btn btn-secondary" type="button" id="vistaCompleta" data-t="ui.encuadrar" disabled></button>
            <button class="btn btn-secondary" type="button" id="compartirVista" data-t="ui.compartir" disabled></button>
          </div>
            <div id="bloqueFecha" hidden>
                <label for="fecha" data-t="c.fecha"></label>
                <input type="range" id="fecha" min="0" max="0" step="1">
                <output id="fechaTexto" for="fecha"></output>
            </div>
            <details class="zm-overlays">
              <summary><span data-t="ui.capas"></span><span id="capasActivas" class="zm-capa-cuenta"></span></summary>
              <fieldset>
                <legend class="sr-only" data-t="c.capas"></legend>
                <label><input type="checkbox" data-capa="acuiferos"> <span data-t="capa.acuiferos"></span></label>
                <label><input type="checkbox" data-capa="pozos"> <span data-t="capa.pozos"></span></label>
                <label><input type="checkbox" data-capa="presas"> <span data-t="capa.presas"></span></label>
                <label><input type="checkbox" data-capa="calidad"> <span data-t="capa.calidad"></span></label>
              </fieldset>
            </details>
            <div id="compartirEstado" class="zm-share-status" role="status" aria-live="polite"></div>
            <input id="enlaceVista" type="text" readonly hidden aria-label="Enlace de la vista / View link">
        </aside>

        <div class="map-wrap">
          <div class="zm-map-bar"><span class="zm-live-dot" aria-hidden="true"></span><span data-t="ui.pista"></span></div>
          <div id="map" role="region" aria-label="Mapa del agua / Water map"></div>
        </div>

        <aside class="panel zm-lateral">
            <div class="zm-inspector-title" data-t="ui.leyenda"></div>
            <div id="leyenda"></div>
            <details class="zm-metodologia"><summary data-t="ui.leer"></summary><p id="notaIndicador" class="zm-nota"></p></details>
            <div id="detalleVacio" class="zm-vacio">
              <span class="zm-vacio-icono" aria-hidden="true">◎</span>
              <strong data-t="ui.ficha"></strong>
              <p data-t="ui.fichaAyuda"></p>
            </div>
            <div id="detalle" aria-live="polite"></div>
        </aside>
    </div>

    <section class="panel zm-origen">
        <details>
        <summary class="zm-origen-summary" data-t="o.titulo"></summary>
        <p id="origenTexto"></p>
        <pre id="origenComando"></pre>
        <details>
            <summary data-t="o.versql"></summary>
            <pre id="origenSql"></pre>
        </details>
        <details class="zm-inventario"><summary data-t="ui.inventario"></summary><ul id="conteos" class="zm-conteos"></ul></details>
        </details>
    </section>
</main>
<footer data-pie></footer>
<script src="assets/vendor/leaflet-1.9.4.js"></script>
<script src="assets/mapa-teselas.js"></script>
<script src="assets/nav.js?v=20261109-b1"></script>
<script src="ijcopi/mapa-zm.js?v=20261109-b1-r2"></script>
</body>
</html>
